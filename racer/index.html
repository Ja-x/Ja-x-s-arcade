<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

		<meta name="application-name" content="Ja-x's Arcade Racer" />
		<meta name="description" content="An old school pseudo-3D arcade racer, part of Ja-x's Arcade." />
		<meta name="keywords" content="outrun, racer, racing, pseudo-3d, arcade, game" />

		<title>Ja-x's Arcade Racer</title>

		<style>
			html, body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				overscroll-behavior: none;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
				-webkit-tap-highlight-color: transparent;
			}

			#game {
				width: 100%;
				height: 100%;
			}

			#game canvas {
				display: block;
			}

			/* ---------------------------------------------------------------------
			   On-screen controls, only shown on touch devices
			   --------------------------------------------------------------------- */
			#touch-controls {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 10;
			}

			#touch-controls.hidden {
				display: none;
			}

			#touch-controls .pad {
				position: absolute;
				bottom: max(16px, env(safe-area-inset-bottom));
				display: flex;
				gap: 14px;
				pointer-events: none;
			}

			#touch-controls .pad.steering { left: max(16px, env(safe-area-inset-left)); }
			#touch-controls .pad.pedals   { right: max(16px, env(safe-area-inset-right)); }

			#touch-controls button {
				pointer-events: auto;
				width: 84px;
				height: 84px;
				border: 2px solid rgba(255, 255, 255, 0.55);
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.35);
				color: #fff;
				font: bold 15px/1 Arial, sans-serif;
				text-transform: uppercase;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}

			#touch-controls button:active {
				background: rgba(255, 255, 255, 0.35);
			}

			#touch-controls button .glyph {
				font-size: 30px;
			}

			@media (max-height: 420px) {
				#touch-controls button { width: 70px; height: 70px; font-size: 13px; }
			}
		</style>
	</head>

	<body>
		<div id="game"></div>

		<div id="touch-controls" class="hidden">
			<div class="pad steering">
				<button id="btn-left"  aria-label="Steer left"><span class="glyph">&#9664;</span></button>
				<button id="btn-right" aria-label="Steer right"><span class="glyph">&#9654;</span></button>
			</div>
			<div class="pad pedals">
				<button id="btn-brake" aria-label="Brake">Brake</button>
				<button id="btn-accel" aria-label="Accelerate">Gas</button>
			</div>
		</div>

		<script src="libs/phaser.min.js"></script>
		<script src="js/config.js"></script>
		<script src="js/utils.js"></script>
		<script src="js/sprites.js"></script>
		<script src="js/controls.js"></script>
		<script src="js/background.js"></script>
		<script src="js/circuit.js"></script>
		<script src="js/player.js"></script>
		<script src="js/traffic.js"></script>
		<script src="js/camera.js"></script>
		<script src="js/hud.js"></script>
		<script src="js/main.js"></script>
	</body>
</html>
