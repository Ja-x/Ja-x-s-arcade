<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onnenpeli – Ja-x's Arcade</title>
<meta name="description" content="Onnenpeli – sarjakuvamainen onnenpelikone geokätköilymysteerin ratkaisemiseen.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hannunvaakuna, piirretään kerran ja käytetään <use>-viittauksilla rullissa. -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="hannunvaakuna" viewBox="0 0 100 100">
      <path d="M34 8 L8 8 L8 34 L92 34 L92 8 L66 8 L66 92 L92 92 L92 66 L8 66 L8 92 L34 92 Z"
            fill="none" stroke="currentColor" stroke-width="9"
            stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<main class="stage">

  <div class="cabinet">

    <header class="cabinet__crown">
      <div class="bulbs" aria-hidden="true"></div>
      <div class="title-row">
        <h1 class="title" id="gameTitle">ONNENPELI</h1>
        <span class="cache-code">GCBWAAF</span>
      </div>
      <p class="subtitle" id="subtitle">Tervetuloa pelaamaan, montako pelikierrosta tarvitset mysteerin ratkaisuun?</p>
    </header>

    <div class="cabinet__body">

      <section class="display" id="display" aria-label="Arvottava koordinaattirivi">
        <div class="display__glass" aria-hidden="true"></div>

        <!-- Rivi rakennetaan js/reels.js:ssä layout-kuvauksen perusteella:
             X ABC° DE.FGH -->
        <div class="coord-row" id="row-main"></div>

        <div class="bubble" id="luckyMessage" hidden>
          <span class="bubble__text" id="luckyText">Kannattaisiko laittaa lotto vetämään?</span>
        </div>
      </section>

      <div class="lever-area">
        <button type="button" class="lever" id="lever"
                aria-label="Vipu: käynnistä arvonta">
          <span class="lever__mount" aria-hidden="true"></span>
          <span class="lever__arm" aria-hidden="true">
            <span class="lever__stick"></span>
            <span class="lever__knob"></span>
          </span>
          <span class="lever__label" id="leverLabel">VEDÄ</span>
        </button>
      </div>

    </div>

    <footer class="cabinet__foot">
      <button type="button" class="sound-toggle" id="soundToggle" aria-pressed="true">
        <svg class="sound-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="sound-toggle__cone" d="M4 9h4l5-4v14l-5-4H4z"/>
          <g class="sound-toggle__waves"><path d="M16.5 9a4.5 4.5 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></g>
          <g class="sound-toggle__cross"><path d="M17 9.5l5 5"/><path d="M22 9.5l-5 5"/></g>
        </svg>
        <span class="sound-toggle__text" id="soundToggleText">SOUNDS: ON</span>
      </button>

      <!-- Kielivalinta: lippu näyttää kielen, johon napista vaihdetaan
           (suomeksi pelatessa Englannin lippu ja päinvastoin). Oletus suomi. -->
      <button type="button" class="lang-toggle" id="langToggle"
              aria-label="Kieli: suomi. Vaihda englanniksi." data-lang="fi">
        <svg class="lang-toggle__flag lang-toggle__flag--fi" viewBox="0 0 18 11" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
          <rect width="18" height="11" fill="#ffffff"/>
          <rect y="4" width="18" height="3" fill="#003580"/>
          <rect x="5" width="3" height="11" fill="#003580"/>
        </svg>
        <svg class="lang-toggle__flag lang-toggle__flag--en" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
          <clipPath id="ukClip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <rect width="60" height="30" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukClip)" stroke="#c8102e" stroke-width="4"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
        </svg>
      </button>

      <p class="hint" id="stateHint">Vedä vivusta aloittaaksesi arvonnan.</p>
    </footer>

  </div>

  <p class="backlink"><a href="../index.html" id="backlink">&larr; Ja-x's Arcade</a></p>

  <!-- Ruudunlukijoille: kierroksen tulos tekstinä. -->
  <p class="sr-only" id="srStatus" role="status" aria-live="polite"></p>

</main>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/reels.js"></script>
<script src="js/game.js"></script>

<!-- GoatCounter-kavijaseuranta (tili: jaxarcade), sama kuin muilla
     pelisivuilla. Ei laske kayntia localhostilla. -->
<script
  data-goatcounter="https://jaxarcade.goatcounter.com/count"
  async
  src="//gc.zgo.at/count.js">
</script>
</body>
</html>
